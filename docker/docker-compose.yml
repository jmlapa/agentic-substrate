services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    container_name: substrate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentic_substrate
    ports:
      - "5432:5432"
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentic_substrate"]
      interval: 5s
      timeout: 5s
      retries: 5

  falkordb:
    image: falkordb/falkordb:v4.20.3-alpine
    container_name: substrate_falkordb
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - ../data/falkordb:/var/lib/falkordb/data
    environment:
      - REDIS_ARGS=--save 60 1 --save 1 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.10-alpine
    container_name: substrate_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ../data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: substrate_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=agentic_substrate
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STORAGE_LOCAL_BASE_DIR=/app/data/storage
      - GRAPH_STORE_TYPE=${GRAPH_STORE_TYPE:-falkordb}
      - EVENT_STORE_TYPE=${EVENT_STORE_TYPE:-postgres}
    volumes:
      - ../data/storage:/app/data/storage
      - ../src:/app/src
      - ../migrations:/app/migrations
    depends_on:
      postgres:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: substrate_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html
    depends_on:
      api:
        condition: service_healthy



