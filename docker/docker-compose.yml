services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: substrate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: substrate
      POSTGRES_PASSWORD: substrate_password
      POSTGRES_DB: substrate_db
    ports:
      - "5432:5432"
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U substrate -d substrate_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  falkordb:
    image: falkordb/falkordb:latest
    container_name: substrate_falkordb
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - ../data/falkordb:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: substrate_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ../data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

