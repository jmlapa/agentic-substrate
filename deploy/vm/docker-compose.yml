services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    container_name: substrate_vm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agentic_substrate}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - substrate_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agentic_substrate}"]
      interval: 5s
      timeout: 5s
      retries: 5

  falkordb:
    image: falkordb/falkordb:v4.20.3-alpine
    container_name: substrate_vm_falkordb
    restart: unless-stopped
    volumes:
      - ./data/falkordb:/var/lib/falkordb/data
    environment:
      - REDIS_ARGS=--save 60 1 --save 1 1
    networks:
      - substrate_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.10-alpine
    container_name: substrate_vm_redis
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    networks:
      - substrate_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: substrate_vm_api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data/storage:/app/data/storage
    networks:
      - substrate_net
    depends_on:
      postgres:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: substrate_vm_frontend
    restart: unless-stopped
    networks:
      - substrate_net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2.8-alpine
    container_name: substrate_vm_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy_data:/data
      - ./data/caddy_config:/config
    networks:
      - substrate_net
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy

networks:
  substrate_net:
    driver: bridge
